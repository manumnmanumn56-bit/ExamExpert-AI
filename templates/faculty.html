<!DOCTYPE html>
<html>
<head>
    <title>ExamExpert AI - Faculty</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input { padding: 6px; margin: 4px; }
        button { padding: 7px 14px; }
        table { border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #999; padding: 8px 14px; text-align: left; }
        th { background: #eee; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>ExamExpert AI</h1>
    <h2>Faculty Management</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/faculty/add">
        <input type="text" name="name" placeholder="Name">
        <input type="text" name="department" placeholder="Department">
        <input type="text" name="designation" placeholder="Designation">
        <input type="text" name="email" placeholder="Email">
        <button type="submit">Add Faculty</button>
    </form>

    <table>
        <tr><th>ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Email</th></tr>
        {% for f in faculty %}
        <tr>
            <td>{{ f.id }}</td>
            <td>{{ f.name }}</td>
            <td>{{ f.department }}</td>
            <td>{{ f.designation }}</td>
            <td>{{ f.email }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
